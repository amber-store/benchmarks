name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Formatting, lints and the unit tests: dataset determinism, adapters,
  # metrics, reports, publishing, cleanup, error handling and the
  # verification failures themselves.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: cachix/install-nix-action@v27
      - run: nix develop --command cargo fmt --check
      - run: nix develop --command cargo clippy --all-targets --locked -- -D warnings
      - run: nix develop --command cargo test --locked
      - run: nix develop --command python3 -m unittest discover -s python

  # The real smoke suite: both cores built from the revisions this
  # repository's flake pins, every backend, the local Garage instance, real
  # HTTP transfers. A correctness gate, not a performance gate — timings from
  # a shared runner are not comparable between runs.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: Swatinem/rust-cache@v2
      - name: Run the smoke profile against every backend
        run: ./run.sh --profile smoke --out "$GITHUB_WORKSPACE/bench-report"
      - name: Require the run to declare itself valid
        if: always()
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/bench-report/report.json"
          test -f "$report" || { echo "no report was written"; exit 1; }
          # The harness already exits non-zero when a run is not clean; this
          # re-checks the artefact itself, so a report that claimed validity
          # it had not earned would still fail the build.
          valid=$(jq -r '.validity.valid' "$report")
          errors=$(jq -r '.errors | length' "$report")
          skipped=$(jq -r '.skipped_backends | length' "$report")
          failed_checks=$(jq -r '[.runs[].verifications[] | select(.passed == false)] | length' "$report")
          failed_cross=$(jq -r '[.cross_checks[] | select(.passed == false)] | length' "$report")
          excluded=$(jq -r '[.summary[].excluded_invalid_samples] | add // 0' "$report")
          echo "valid=$valid errors=$errors skipped=$skipped checks_failed=$failed_checks cross_failed=$failed_cross excluded_samples=$excluded"
          # Every backend the suite knows must have produced measurements.
          for backend in amber-rust amber-go git restic nix fs-sha256 \
                         amber-rust-s3 amber-go-s3 restic-s3 git-bundle-s3 nix-binary-cache; do
            n=$(jq -r --arg b "$backend" '[.summary[] | select(.backend == $b and .ok > 0)] | length' "$report")
            echo "$backend: $n measured operation(s)"
            test "$n" -gt 0 || { echo "$backend produced no measurement"; exit 1; }
          done
          # Both cores must have been built from a known source revision:
          # a report that cannot say what it measured is not a result.
          for core in amber-rust amber-go; do
            jq -e --arg c "$core" '.tools.tools[$c].source_commit | length == 40' "$report" > /dev/null \
              || { echo "$core has no recorded source revision"; exit 1; }
          done
          # And the two cores must have agreed on their root keys.
          jq -e '[.cross_checks[] | select(.name == "amber_cores_agree_on_root_keys" and .passed)] | length == 1' "$report" > /dev/null
          test "$valid" = "true"
          test "$errors" -eq 0
          test "$skipped" -eq 0
          test "$failed_checks" -eq 0
          test "$failed_cross" -eq 0
          test "$excluded" -eq 0
      - name: Publish it the way a recorded result is published
        if: always()
        run: |
          set -euo pipefail
          nix develop --command \
            ./target/release/amber-cas-bench publish \
              --report "$GITHUB_WORKSPACE/bench-report" \
              --results "$RUNNER_TEMP/published" \
              --id ci-smoke \
              --label "CI smoke run: a correctness gate, not a measurement"
          test -s "$RUNNER_TEMP/published/ci-smoke/README.md"
          test -d "$RUNNER_TEMP/published/ci-smoke/plots"
          # Nothing that names the machine it ran on may reach a published
          # directory.
          ! grep -rqF "$GITHUB_WORKSPACE" "$RUNNER_TEMP/published"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke-report
          path: |
            bench-report/REPORT.md
            bench-report/report.json
            bench-report/*.csv
          if-no-files-found: warn

  # The core-operation benchmark: both native drivers, the whole correctness
  # suite, the coverage matrix and the report's own tests. Timings from a
  # shared runner are not comparable, so this job is a correctness gate — it
  # runs the `quick` profile, which exists for exactly that.
  core-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: Swatinem/rust-cache@v2

      - name: Lint both drivers
        run: |
          set -euo pipefail
          nix develop --command bash -c 'cd core-ops/go && gofmt -l . | tee /tmp/gofmt.out && test ! -s /tmp/gofmt.out'
          nix develop --command bash -c 'cd core-ops/go && go vet ./...'
          nix develop --command bash -c 'cd core-ops/coverage/goexports && gofmt -l . | tee /tmp/gofmt2.out && test ! -s /tmp/gofmt2.out'
          nix develop --command bash -c 'cd core-ops/rust && cargo fmt --check'
          nix develop --command bash -c 'cd core-ops/rust && cargo clippy --locked --all-targets'

      - name: The report's own tests
        run: nix develop --command python3 -m unittest discover -s core-ops/report

      - name: The coverage matrix covers both cores' whole exported surface
        run: |
          set -euo pipefail
          # Re-extract from the pinned sources, so a core bump that adds an
          # export fails here rather than quietly going unmeasured.
          nix develop --command ./core-ops/coverage/refresh.sh
          git diff --exit-code core-ops/COVERAGE.md core-ops/coverage/*.txt

      - name: Run the quick profile against both pinned cores
        run: ./core-ops/run.sh --profile quick --out "$GITHUB_WORKSPACE/core-ops-report" --cpus 2

      - name: Require the run to have earned its comparison
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/core-ops-report"
          test -f "$dir/identity.json"
          test -f "$dir/quick/report.json"
          # Both cores identified, pin verified, nothing dirty.
          jq -e '.pin_verified == true' "$dir/identity.json" > /dev/null
          for core in go rust; do
            jq -e --arg c "$core" '.cores[$c].revision | length == 40' "$dir/identity.json" > /dev/null
            jq -e --arg c "$core" '.cores[$c].driver_sha256 | length == 64' "$dir/identity.json" > /dev/null
            jq -e --arg c "$core" '.cores[$c].dirty == false' "$dir/identity.json" > /dev/null
          done
          jq -e '.cores.go.module_tree_vs_pinned_source | test("identical")' \
            "$dir/identity.json" > /dev/null
          # Every check passed on both sides, and the cross-core digests agree.
          for core in go rust; do
            failed=$(jq --arg c "$core" '[.checks[] | select(.passed == false)] | length' \
              "$dir/quick/$core.json")
            echo "$core: $failed failed checks"
            test "$failed" -eq 0
          done
          jq -e '[.validity[] | select(startswith("all ") and endswith("identical"))] | length == 1' \
            "$dir/quick/report.json" > /dev/null
          # And the matrix's measured rows really were measured.
          nix develop --command python3 core-ops/coverage/matrix.py check \
            --report "$dir/quick/report.json"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-ops-quick-report
          path: |
            core-ops-report/identity.json
            core-ops-report/quick/REPORT.md
            core-ops-report/quick/*.json
            core-ops-report/quick/*.csv
          if-no-files-found: warn

  # The notebook has to keep working against the results committed here, and
  # it has to keep refusing to compare an invalid one.
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Execute the notebook against every recorded run
        run: |
          set -euo pipefail
          for run in results/*/run.json; do
            id=$(basename "$(dirname "$run")")
            echo "== $id"
            AMBER_BENCH_RESULTS="$PWD/results" AMBER_BENCH_RUN="$id" \
              nix develop --command jupyter nbconvert --to notebook --execute \
                --output "$RUNNER_TEMP/executed-$id.ipynb" results/explore.ipynb
          done
